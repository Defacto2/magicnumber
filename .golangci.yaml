version: '2'
linters:
  default: all
  disable:
    - dupl
    - nlreturn
    - noinlineerr
    - varnamelen
    - wsl_v5
    # retired
    - exhaustruct
    - gomodguard
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupword
          - funlen
          - gocyclo
        path: _test\.go$
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    cyclop:
      max-complexity: 15
    misspell:
      ignore-rules:
        - freedos
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - 'golang.org/x/text'
            - 'github.com/nalgeon/be'
            - 'github.com/Defacto2/magicnumber'
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
